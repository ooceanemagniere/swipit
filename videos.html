<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Océane Magnière - Swipit | Vidéos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8; /* Fond clair */
            color: #000; /* Texte noir */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            padding: 1rem;
            z-index: 1000;
        }

        .logo {
            height: 40px;
            cursor: pointer;
        }

        .main-header {
            text-align: center;
            padding: 100px 20px 20px;
        }

        h1 {
            margin: 0;
            font-size: 2em;
        }

        h2 {
            margin: 10px 0 0;
            font-weight: normal;
            font-size: 1.5em;
            color: #444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 300px));
            gap: 20px;
            justify-content: center;
            padding: 40px;
        }

        .project {
            position: relative;
            overflow: hidden;
            border: 1px solid #ccc; /* bordure grise pour contraste clair */
            border-radius: 10px;
            cursor: pointer;
            height: 400px;

        }

        .project img,
        .project video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          background-color: #eee; /* pour voir les zones vides */
          display: block;
        }

        .project:hover img {
            transform: scale(1.05);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-size: 1.5em;
            text-align: center;
        }

        .project:hover .overlay {
            opacity: 1;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .footer-global {
            margin-top: auto;
            text-align: center;
            padding: 1rem 0;
            color: #777;
        }

        .back-link {
            display: block;
            text-align: center;
            margin: 20px auto 0;
            font-size: 0.9em;
            font-style: italic;
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #47B5FF;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
        .top-right-links {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 3;
            display: flex;
            gap: 15px;
        }

        .top-right-links a {
            color: black;
            text-decoration: none;
            font-size: 0.95em;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .top-right-links a:hover {
            border-color: #47B5FF;
        }

    </style>
</head>
<body>
    <header class="header">
        <a href="index.html">
            <img src="images/swipitnoir.png" alt="Logo Swipit" class="logo">
        </a>
    </header>

    <div class="top-right-links">
            <a href="apropos.html">En savoir plus</a>
            <a href="contact.html">Contact</a>
    </div>

    <header class="main-header">
        <h1>Océane Magnière</h1>
        <img src="images/swipitnoir.png" alt="Swipit Logo" style="width: 50px; max-width: 80%; margin-bottom: 0.5em;">
    </header>

    <a href="index.html" class="back-link">Retour</a>

    <section class="grid">
        <a href="galerie-video-leslunettesdemathilde.html" class="project">
            <img src="images/mathilde10.png" alt="Les Lunettes de Mathilde">
            <div class="overlay">Les Lunettes de Mathilde</div>
        </a>
        <a href="video2.html" class="project">
            <img src="images/XXX.jpg" alt="OM Design">
            <div class="overlay">OM Design</div>
        </a>
        <a href="video3.html" class="project">
            <img src="images/XXX.jpg" alt="Buet Immobilier">
            <div class="overlay">Buet Immobilier</div>
        </a>
        <!-- Ajoute autant de vidéos que tu veux -->
    </section>

    <script>
        document.querySelectorAll('.project video').forEach(video => {
            video.addEventListener('mouseenter', () => video.play());
            video.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0;
            });
        });
    </script>

    <footer class="footer-global">© 2025 Swipit — Tous droits réservés</footer>
</body>
</html>
