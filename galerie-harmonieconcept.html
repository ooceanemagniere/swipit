<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonie Concept - Galerie Photos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8; /* fond clair */
            color: #000; /* texte noir */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            padding: 1rem;
            z-index: 1000;
        }

        .logo {
            height: 40px;
            cursor: pointer;
        }

        header h1 {
            margin-top: 80px;
            text-align: center;
            font-size: 2em;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .footer-global {
            margin-top: auto;
            text-align: center;
            padding: 1rem 0;
            color: #555;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            width: 90vw;
            height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .lightbox:target {
            display: flex;
        }

        .back-link {
            display: block;
            text-align: center;
            margin: 20px auto 0;
            font-size: 0.9em;
            font-style: italic;
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #47B5FF;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">
            <img src="images/swipitnoir.png" alt="Logo Swipit" class="logo">
        </a>
    </div>

    <header>
        <h1>Harmonie Concept</h1>
    </header>

    <a href="photos.html" class="back-link">Retour aux projets</a>

    <section class="gallery">
        <a href="#img1"><img src="images/harmonie2.jpg" alt="Photo 1"></a>
        <a href="#img2"><img src="images/harmonie1.jpg" alt="Photo 2"></a>
        <a href="#img3"><img src="images/harmonie11.jpg" alt="Photo 3"></a>
        <a href="#img4"><img src="images/harmonie14.jpg" alt="Photo 4"></a>
        <a href="#img5"><img src="images/harmonie16.jpg" alt="Photo 5"></a>
        <a href="#img6"><img src="images/harmonie15.jpg" alt="Photo 6"></a>
        <a href="#img7"><img src="images/harmonie7.jpg" alt="Photo 7"></a>
        <a href="#img8"><img src="images/harmonie8.jpg" alt="Photo 8"></a>
        <a href="#img9"><img src="images/harmonie6.jpg" alt="Photo 9"></a>
        <a href="#img10"><img src="images/harmonie17.jpg" alt="Photo 10"></a>
        <a href="#img11"><img src="images/harmonie13.jpg" alt="Photo 11"></a>
        <a href="#img12"><img src="images/harmonie18.jpg" alt="Photo 12"></a>
    </section>

    <!-- Lightbox Images -->
    <div id="img1" class="lightbox"><a href="#"><img src="images/harmonie2.jpg" alt="Photo 1"></a></div>
    <div id="img2" class="lightbox"><a href="#"><img src="images/harmonie1.jpg" alt="Photo 2"></a></div>
    <div id="img3" class="lightbox"><a href="#"><img src="images/harmonie11.jpg" alt="Photo 3"></a></div>
    <div id="img4" class="lightbox"><a href="#"><img src="images/harmonie14.jpg" alt="Photo 4"></a></div>
    <div id="img5" class="lightbox"><a href="#"><img src="images/harmonie16.jpg" alt="Photo 5"></a></div>
    <div id="img6" class="lightbox"><a href="#"><img src="images/harmonie15.jpg" alt="Photo 6"></a></div>
    <div id="img7" class="lightbox"><a href="#"><img src="images/harmonie7.jpg" alt="Photo 7"></a></div>
    <div id="img8" class="lightbox"><a href="#"><img src="images/harmonie8.jpg" alt="Photo 8"></a></div>
    <div id="img9" class="lightbox"><a href="#"><img src="images/harmonie6.jpg" alt="Photo 9"></a></div>
    <div id="img10" class="lightbox"><a href="#"><img src="images/harmonie17.jpg" alt="Photo 10"></a></div>
    <div id="img11" class="lightbox"><a href="#"><img src="images/harmonie13.jpg" alt="Photo 11"></a></div>
    <div id="img12" class="lightbox"><a href="#"><img src="images/harmonie18.jpg" alt="Photo 12"></a></div>

    <footer class="footer-global">© 2025 Swipit — Tous droits réservés</footer>

    <!-- Script pour désactiver le scroll au retour -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const observer = new MutationObserver(() => {
                if (!document.querySelector('.lightboxOverlay')) {
                    history.replaceState(null, null, ' ');
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        });
    </script>

</body>
</html>
