<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Merci pour votre message</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 40px;
            color: #555;
            line-height: 1.6;
        }

        a.button {
            display: inline-block;
            padding: 14px 32px;
            border: 1px solid #111;
            text-decoration: none;
            color: #111;
            font-size: 0.95em;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        a.button:hover {
            background-color: #111;
            color: #fff;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Merci pour votre message</h1>
        <p>Je vous répondrai très prochainement.<br>À bientôt,</p>
        <a href="index.html" class="button">Retour à l’accueil</a>
    </div>
</body>
</html>
