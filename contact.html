<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Swipit</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      padding: 1rem;
      z-index: 1000;
      background-color: white;
      width: 100%;
    }

    .logo {
      height: 40px;
      cursor: pointer;
    }

    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 80px;
      padding-bottom: 50px;
    }

    .content {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
    }

    .form-container {
      width: 50%;
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-container h1 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 1rem;
      color: #333;
    }

    .input-fields input, .input-fields textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1.1em;
      background-color: #f9f9f9;
      transition: all 0.3s ease;
    }

    .input-fields input:focus, .input-fields textarea:focus {
      border-color: #000;
      background-color: #fff;
    }

    textarea {
      resize: vertical;
      height: 150px;
    }

    button {
      background-color: #000;
      color: white;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #333;
    }

    .image-container {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      max-height: 600px; /* Augmenter la taille de l'image */
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .footer-global {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 1.5rem 0;
      position: relative;
    }

    .footer-global .contact-info {
      margin-bottom: 0.5rem;
      font-size: 1.2em;
    }

    .footer-global a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .footer-global a:hover {
      color: #47B5FF;
    }

    .footer-global p {
      font-size: 0.9em;
    }

    @media (max-width: 768px) {
      .content {
        flex-direction: column;
      }

      .form-container, .image-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header avec logo -->
  <header class="header">
    <a href="index.html">
      <img src="images/swipitnoir.png" alt="Logo Swipit" class="logo">
    </a>
  </header>

  <!-- Section principale avec image à côté -->
  <main>
    <div class="content">
      <!-- Formulaire de contact -->
      <div class="form-container">
        <h1>Contactez-nous</h1>

        <div class="input-fields">
          <input type="text" placeholder="Votre nom" required>
          <input type="email" placeholder="Votre email" required>
          <textarea placeholder="Votre message" required></textarea>
        </div>

        <button type="submit">Envoyer</button>
      </div>

      <!-- Image à côté -->
      <div class="image-container">
        <img src="images/mathilde22.webp" alt="Photo de Mathilde" />
      </div>
    </div>
  </main>

  <!-- Footer avec coordonnées -->
  <footer class="footer-global">
    <div class="contact-info">
      <p><a href="mailto:contact@swipit.fr">contact@swipit.fr</a> | 07 81 20 74 49</p>
    </div>
    <p>© 2025 Swipit — Tous droits réservés</p>
  </footer>

</body>
</html>
