<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyPro - Galerie Photos</title>
    <!-- Lightbox2 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
    <!-- Lightbox2 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8; /* fond clair */
            color: #000; /* texte noir */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            padding: 1rem;
            z-index: 1000;
        }

        .logo {
            height: 40px;
            cursor: pointer;
        }

        header h1 {
            margin-top: 80px;
            text-align: center;
            font-size: 2em;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .footer-global {
            margin-top: auto;
            text-align: center;
            padding: 1rem 0;
            color: #555;
        }

        /* Lightbox personnalisé */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            width: 90vw;
            height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .lightbox:target {
            display: flex;
        }

        .back-link {
            display: block;
            text-align: center;
            margin: 20px auto 0;
            font-size: 0.9em;
            font-style: italic;
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #47B5FF;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">
            <img src="images/swipitnoir.png" alt="Logo Swipit" class="logo">
        </a>
    </div>

    <header>
        <h1>KeyPro</h1>
    </header>

    <a href="photos.html" class="back-link">Retour aux projets</a>

    <section class="gallery">
        <a href="#img1"><img src="images/J.jpg" alt="Photo 1"></a>
        <a href="#img2"><img src="images/JC.jpg" alt="Photo 2"></a>
        <a href="#img3"><img src="images/C.png" alt="Photo 3"></a>
        <a href="#img4"><img src="images/photo4.jpg" alt="Photo 4"></a>
        <a href="#img5"><img src="images/photo5.jpg" alt="Photo 5"></a>
    </section>

    <!-- Lightbox -->
    <div id="img1" class="lightbox">
        <a href="#"><img src="images/J.jpg" alt="Photo 1"></a>
    </div>
    <div id="img2" class="lightbox">
        <a href="#"><img src="images/JC.jpg" alt="Photo 2"></a>
    </div>
    <div id="img3" class="lightbox">
        <a href="#"><img src="images/C.png" alt="Photo 3"></a>
    </div>
    <div id="img4" class="lightbox">
        <a href="#"><img src="images/photo4.jpg" alt="Photo 4"></a>
    </div>
    <div id="img5" class="lightbox">
        <a href="#"><img src="images/photo5.jpg" alt="Photo 5"></a>
    </div>

    <footer class="footer-global">© 2025 Swipit — Tous droits réservés</footer>

</body>
</html>
