<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyPro - Galerie Photos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            padding: 1rem;
            z-index: 1000;
        }

        .logo {
            height: 40px;
            cursor: pointer;
        }

        header h1 {
            margin-top: 80px;
            text-align: center;
            font-size: 2em;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .footer-global {
            margin-top: auto;
            text-align: center;
            padding: 1rem 0;
            color: #555;
        }

        .back-link {
            display: block;
            text-align: center;
            margin: 20px auto 0;
            font-size: 0.9em;
            font-style: italic;
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #47B5FF;
        }

        /* Lightbox CSS */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            width: 90vw;
            height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }
